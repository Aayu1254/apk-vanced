name: Direct Download & Rolling Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direct download URLs (one per line, optional custom name after space: URL [filename])'
        required: true
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Files from URLs
        env:
          URLS: ${{ inputs.urls }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue

            read -r url custom_name <<< "$line"
            echo "---------------------------------------------------"
            echo "[INFO] Processing: $url"

            if [ -n "$custom_name" ]; then
              echo "  [+] Output name: $custom_name"
              curl -fSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                --retry 3 --retry-delay 2 \
                -o "$custom_name" "$url"
            else
              curl -fSL -OJ -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                --retry 3 --retry-delay 2 \
                "$url"
            fi
          done <<< "$URLS"

      - name: Publish Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x update_and_archive.sh
          ./update_and_archive.sh
