name: Latest APK Scraper (Rolling Release)

on:
  workflow_dispatch:

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install apkmirror-downloader
        run: npm install -g apkmirror-downloader

      - name: Inject Versions into Filenames
        run: |
          # Parses apps.json, replaces '{0}' with the version, and creates the outFile parameter required by the CLI
          jq '.apps |= map(. as $app | .outFile = ($app.filename_template | split("{0}") | join($app.version)) | del(.filename_template))' apps.json > run.json
          
          echo "[INFO] Generated Configuration:"
          cat run.json

      - name: Download APKs sequentially
        # $(which apkmd) finds the exact path of the installed file, and 'node' forces it to run as JavaScript
        run: node $(which apkmd) run.json

      - name: Publish Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Move files from the "downloads" directory to the root where the script expects them
          mv downloads/* . 
          
          # Execute your custom release script
          chmod +x update_and_archive.sh
          ./update_and_archive.sh