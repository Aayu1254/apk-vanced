name: Append to Latest Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direct download URLs (separated by space, comma, semicolon, or newline. Optional name: URL [filename])'
        required: true
        type: string

jobs:
  append-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Files from URLs
        env:
          URLS: ${{ inputs.urls }}
        run: |
          current_url=""
          current_name=""

          download_item() {
            if [ -n "$current_url" ]; then
              echo "---------------------------------------------------"
              echo "[INFO] Downloading: $current_url"
              if [ -n "$current_name" ]; then
                echo "  [+] Custom filename: $current_name"
                curl -fSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                  --retry 3 --retry-delay 2 \
                  -o "$current_name" "$current_url"
              else
                curl -fSL -OJ -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                  --retry 3 --retry-delay 2 \
                  "$current_url"
              fi
              current_url=""
              current_name=""
            fi
          }

          for raw_token in $URLS; do
            # Strip leading/trailing commas and semicolons used as separators
            token="$(echo "$raw_token" | sed -e 's/^[,;]*//' -e 's/[,;]*$//')"
            [ -z "$token" ] && continue
            [[ "$token" =~ ^# ]] && continue

            case "$token" in
              http://*|https://*)
                download_item
                current_url="$token"
                ;;
              *)
                if [ -n "$current_url" ] && [ -z "$current_name" ]; then
                  current_name="$token"
                fi
                ;;
            esac
          done
          download_item

      - name: Append to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x append_to_latest.sh
          ./append_to_latest.sh
